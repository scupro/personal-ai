name = "personal-ai"
main = "src/index.js"
compatibility_date = "2026-08-16"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
run_worker_first = true

[observability]
enabled = true

[vars]
# APP_ORIGIN is optional. Set it after binding a custom domain, e.g.
# APP_ORIGIN = "https://ai.example.com"
SESSION_DAYS = "30"

# D1 is optional for the first Dashboard deployment. While this block is
# commented out, the Worker still deploys and chat/image/login work, but
# /api/me reports sync:false and cross-device sync is disabled.
#
# When you are ready to enable sync:
#   1. Create the database in Dashboard: Storage & Databases -> D1 -> Create
#   2. Run migrations/0001_init.sql in the D1 Console (or use Wrangler below)
#   3. Uncomment this block and paste the real Database ID
#   4. Commit/push so Workers Builds redeploys
#
# [[d1_databases]]
# binding = "DB"
# database_name = "personal-ai"
# database_id = "PASTE_DATABASE_ID_HERE"
# migrations_dir = "migrations"

# Secrets (never put these in this file):
#   npx wrangler secret put APP_PASSWORD
#   npx wrangler secret put AUTH_SECRET
#   npx wrangler secret put GROQ_API_KEY     # optional server-side default
#   npx wrangler secret put TAVILY_API_KEY   # optional
# Optional default model for the server-side Groq fallback:
# [vars] GROQ_MODEL = "openai/gpt-oss-120b"